<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Reliability Lab — 运维治理控制台</title>
<style>
  :root {
    --bg: #f1f5f9; --surface: #ffffff; --surface-2: #f8fafc;
    --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
    --brand: #4f46e5; --brand-weak: #eef2ff;
    --auto: #059669; --auto-weak: #ecfdf5;     /* committed / auto */
    --pending: #d97706; --pending-weak: #fffbeb; /* pending_approval */
    --escalate: #e11d48; --escalate-weak: #fff1f2; /* escalated / blocked */
    --noop: #64748b; --noop-weak: #f1f5f9;       /* no_op */
    --detect: #2563eb; --detect-weak: #eff6ff;   /* conditions */
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.05);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  @media (prefers-reduced-motion: no-preference) {
    .tab, .btn, .chip, .card { transition: all .18s ease; }
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 14px 24px; background: #0f172a; color: #e2e8f0;
    position: sticky; top: 0; z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
  header .brand svg { width: 22px; height: 22px; }
  header .sub { color: #94a3b8; font-weight: 500; font-size: 12px; }
  .failclosed {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
    background: rgba(5,150,105,.15); color: #6ee7b7; border: 1px solid rgba(5,150,105,.35);
    border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .failclosed .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 24px 64px; }
  nav.tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); padding: 9px 15px; border-radius: 999px; cursor: pointer;
    font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--text); border-color: #cbd5e1; }
  .tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .tab .count { background: rgba(0,0,0,.12); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
  .tab.active .count { background: rgba(255,255,255,.22); }
  .tab:focus-visible, .btn:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }
  .view { display: none; }
  .view.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
  .pad { padding: 18px; }
  h2.section { font-size: 13px; letter-spacing: .02em; color: var(--muted); margin: 0 0 14px; font-weight: 700; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  textarea, select, input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px;
    font: inherit; color: var(--text); background: var(--surface-2);
  }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .field { margin-bottom: 14px; }
  .btn {
    appearance: none; border: 1px solid var(--brand); background: var(--brand); color: #fff;
    padding: 10px 16px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13px;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn.ghost:hover { border-color: #cbd5e1; background: var(--surface-2); }
  .btn.ok { background: var(--auto); border-color: var(--auto); }
  .btn.danger { background: var(--escalate); border-color: var(--escalate); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip {
    border: 1px dashed var(--border); background: var(--surface-2); color: var(--muted);
    padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .chip:hover { border-style: solid; color: var(--text); border-color: #cbd5e1; }
  .chip .role { color: var(--brand); }
  /* timeline */
  .timeline { display: flex; flex-direction: column; gap: 0; }
  .stage { display: grid; grid-template-columns: 34px 1fr; gap: 14px; }
  .stage .rail { display: flex; flex-direction: column; align-items: center; }
  .stage .node { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .stage .line { width: 2px; flex: 1; background: var(--border); margin: 4px 0; }
  .stage:last-child .line { display: none; }
  .stage .body { padding-bottom: 18px; }
  .stage .label { font-size: 11px; letter-spacing: .04em; color: var(--muted); }
  .stage .headline { font-weight: 600; margin: 2px 0 6px; }
  .n-read { background: var(--detect); } .n-detect { background: var(--detect); }
  .n-act { background: var(--brand); } .n-govern { background: var(--noop); }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; border: 1px solid transparent;
  }
  .pill.auto { background: var(--auto-weak); color: var(--auto); border-color: #a7f3d0; }
  .pill.approval, .pill.pending_approval { background: var(--pending-weak); color: var(--pending); border-color: #fde68a; }
  .pill.terminal, .pill.escalated { background: var(--escalate-weak); color: var(--escalate); border-color: #fecdd3; }
  .pill.none, .pill.no_op { background: var(--noop-weak); color: var(--noop); border-color: var(--border); }
  .pill.committed { background: var(--auto-weak); color: var(--auto); border-color: #a7f3d0; }
  .pill.cond { background: var(--detect-weak); color: var(--detect); border-color: #bfdbfe; }
  .pill.ok { background: var(--auto-weak); color: var(--auto); border-color: #a7f3d0; }
  .pill.bad { background: var(--escalate-weak); color: var(--escalate); border-color: #fecdd3; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: var(--muted); }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  th { font-size: 11px; letter-spacing: .03em; color: var(--muted); background: var(--surface-2); position: sticky; top: 56px; font-weight: 700; }
  tr:hover td { background: var(--surface-2); }
  .banner { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-weight: 600; font-size: 13px; }
  .banner.blocked { background: var(--escalate-weak); color: var(--escalate); border: 1px solid #fecdd3; }
  .pending-card { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 16px; border-bottom: 1px solid var(--border); }
  .pending-card:last-child { border-bottom: none; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50; }
  .toast.show { opacity: 1; }
  .muted-note { color: var(--muted); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
    Agent Reliability Lab <span class="sub">· 证据感知的动作治理 · TrustRAG legacy codename</span>
  </div>
  <span class="failclosed"><span class="dot"></span> 失败即拒 · validator 强制</span>
</header>

<main>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="run" role="tab">读 → 判 → 动 → 治</button>
    <button class="tab" data-view="pending" role="tab">待审批 <span class="count" id="cnt-pending">0</span></button>
    <button class="tab" data-view="audit" role="tab">审计链 <span class="count" id="cnt-audit">0</span></button>
    <button class="tab" data-view="blocked" role="tab">拦截 / 升级 <span class="count" id="cnt-blocked">0</span></button>
  </nav>

  <!-- RUN -->
  <section class="view active" id="view-run">
    <div class="grid">
      <div class="card pad">
        <h2 class="section">运行一次治理</h2>
        <div class="field">
          <label for="q">运维查询</label>
          <textarea id="q" placeholder="例如：我们的部署 SOP 仍用 PodSecurityPolicy admission 拦 pod，这个流程还现行吗？"></textarea>
        </div>
        <div class="row field">
          <div>
            <label for="role">操作者角色</label>
            <select id="role"><option value="admin">admin（管理员）</option><option value="editor">editor（编辑）</option><option value="viewer">viewer（只读）</option></select>
          </div>
          <div>
            <label for="ctrl">控制器</label>
            <select id="ctrl"><option value="rule">规则（确定性）</option><option value="llm">LLM</option></select>
          </div>
        </div>
        <button class="btn" id="runBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg> 运行</button>
        <div class="muted-note">在线演示展示 agent <b>拟议</b>的决策及其治理路由；副作用写入隔离的演示存储。</div>
        <h2 class="section" style="margin-top:22px">预置场景</h2>
        <div class="chips" id="chips"></div>
      </div>

      <div class="card pad" id="resultPanel">
        <div class="empty" id="resultEmpty">运行一次治理，查看「读 → 判 → 动 → 治」全过程。</div>
        <div id="resultBody" style="display:none"></div>
      </div>
    </div>
  </section>

  <!-- PENDING -->
  <section class="view" id="view-pending">
    <div class="card">
      <div class="pad"><h2 class="section" style="margin:0">等待人工审批的高风险动作</h2>
        <div class="muted-note">工单与告警只是<b>已拟议、未提交</b>——必须人工批准后副作用才生效。</div>
      </div>
      <div id="pendingList"></div>
    </div>
  </section>

  <!-- AUDIT -->
  <section class="view" id="view-audit">
    <div class="card">
      <div class="pad"><h2 class="section" style="margin:0">仅追加的动作审计链</h2></div>
      <div id="auditTable"></div>
    </div>
  </section>

  <!-- BLOCKED -->
  <section class="view" id="view-blocked">
    <div class="banner blocked"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg> 失败即拒的实证：越权与无证据动作一律被拦截并升级，绝不提交。</div>
    <div class="card"><div id="blockedTable"></div></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const API = "/govern";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SCENARIOS = [
  { label: "废弃流程", role: "admin", q: "我们的部署 SOP 仍用 PodSecurityPolicy admission 拦 pod，这个流程还现行吗？" },
  { label: "配置违规", role: "admin", q: "restricted 命名空间里某 deployment 设了 securityContext.privileged=true，该怎么处理？" },
  { label: "双活冲突", role: "admin", q: "两篇 active runbook 对生产 etcd 备份周期给了 6h 和 24h，现在听哪个？" },
  { label: "越权请求", role: "viewer", q: "给命名空间 X 的 privileged-pod 违规开一张整改工单。" },
  { label: "正常无需动作", role: "admin", q: "怎么对一个 Deployment 做滚动更新？" },
];

// 枚举值（动作/状态/层级）→ 中文展示
const ACTION_ZH = { flag_stale: "标记过期", open_remediation_ticket: "开整改工单", send_alert: "发告警", escalate_to_human: "升级给人", no_op: "无动作" };
const STATE_ZH = { committed: "已提交", pending_approval: "待审批", escalated: "已升级", none: "无动作", dropped: "已驳回" };
const TIER_ZH = { auto: "自动", approval: "需审批", terminal: "终结", none: "无" };
const az = (a) => ACTION_ZH[a] || a;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
function tierClass(t) { return ({auto:"auto", approval:"approval", terminal:"terminal", none:"none"})[t] || "none"; }
function stateClass(s) { return ({committed:"committed", pending_approval:"pending_approval", escalated:"escalated", none:"none", dropped:"none"})[s] || "none"; }

document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  tab.classList.add("active");
  $("#view-" + tab.dataset.view).classList.add("active");
  if (tab.dataset.view === "pending") loadPending();
  if (tab.dataset.view === "audit") loadAudit();
  if (tab.dataset.view === "blocked") loadBlocked();
}));

// 预置场景按钮
const chips = $("#chips");
SCENARIOS.forEach(s => {
  const b = document.createElement("button");
  b.className = "chip"; b.innerHTML = esc(s.label) + ' <span class="role">@' + esc(s.role) + '</span>';
  b.addEventListener("click", () => { $("#q").value = s.q; $("#role").value = s.role; runPass(); });
  chips.appendChild(b);
});

$("#runBtn").addEventListener("click", runPass);

async function runPass() {
  const query = $("#q").value.trim();
  if (!query) { toast("请先输入查询"); return; }
  const btn = $("#runBtn"); btn.disabled = true; btn.textContent = "运行中…";
  try {
    const res = await fetch(API + "/run", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ query, user_role: $("#role").value, controller: $("#ctrl").value })
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    renderResult(data.result, data.trace);
    refreshCounts();
  } catch (e) { toast("运行失败：" + e.message); }
  finally { btn.disabled = false; btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg> 运行'; }
}

function renderResult(r, t) {
  $("#resultEmpty").style.display = "none";
  const body = $("#resultBody"); body.style.display = "block";
  const conds = (r.detected_conditions || []);
  const condHtml = conds.length ? conds.map(c => `<span class="pill cond">${esc(c)}</span>`).join(" ") : '<span class="pill none">无条件</span>';
  const cites = (t.surviving_chunk_ids || t.retrieved_chunk_ids || []).slice(0, 4);
  const blocked = (t.blocked_chunk_ids || []);
  const authOk = r.authorized_actor;
  const valOk = r.validator_ok;
  const forced = r.forced_action;
  const state = r.approval_state || "none";
  const govLabel = state === "committed" ? "已执行（committed）"
      : state === "pending_approval" ? "等待人工审批"
      : state === "escalated" ? "已升级给人" : "无动作";
  const evZh = r.evidence_decision === "sufficient" ? "证据充分" : "证据不足";

  body.innerHTML = `
    <div class="timeline">
      <div class="stage">
        <div class="rail"><div class="node n-read">读</div><div class="line"></div></div>
        <div class="body"><div class="label">读 · 检索</div>
          <div class="headline">检索 ${(t.retrieved_chunk_ids||[]).length} 个片段，${(t.surviving_chunk_ids||[]).length} 个通过门控</div>
          <div class="kv">${cites.map(c => `<span class="mono">${esc(c)}</span>`).join("")}
          ${blocked.length ? `<span class="pill bad">${blocked.length} 个被 ACL 拦截</span>` : ""}</div>
        </div>
      </div>
      <div class="stage">
        <div class="rail"><div class="node n-detect">判</div><div class="line"></div></div>
        <div class="body"><div class="label">判 · 条件检测</div>
          <div class="headline">${condHtml}</div>
          <div class="kv"><span class="pill ${authOk?'ok':'bad'}">${authOk?'操作者已授权':'操作者未授权'}</span>
          <span class="pill ${r.evidence_decision==='sufficient'?'ok':'bad'}">${evZh}</span></div>
        </div>
      </div>
      <div class="stage">
        <div class="rail"><div class="node n-act">动</div><div class="line"></div></div>
        <div class="body"><div class="label">动 · 拟议动作（${esc(r.controller_source)}）</div>
          <div class="headline"><span class="pill ${tierClass(r.risk_tier)}">${az(r.proposed_action)}</span>
          <span class="muted-note" style="display:inline">风险层：${TIER_ZH[r.risk_tier]||esc(r.risk_tier)}</span></div>
        </div>
      </div>
      <div class="stage">
        <div class="rail"><div class="node n-govern">治</div></div>
        <div class="body"><div class="label">治 · validator 校验 + 路由</div>
          <div class="headline"><span class="pill ${valOk?'ok':'bad'}">validator ${valOk?'通过':'拒绝 → 强制'+az(forced)}</span>
          <span class="pill ${stateClass(state)}">${esc(govLabel)}</span></div>
          ${r.sink_record_id ? `<div class="kv"><span class="mono">记录：${esc(r.sink_record_id)}</span></div>` : ""}
          ${(!authOk || r.evidence_decision==='insufficient') ? '<div class="muted-note">⛨ 失败即拒：已阻止副作用，转交人工处理。</div>' : ""}
        </div>
      </div>
    </div>`;
}

async function loadPending() {
  const list = $("#pendingList");
  try {
    const rows = await (await fetch(API + "/pending")).json();
    $("#cnt-pending").textContent = rows.length;
    if (!rows.length) { list.innerHTML = '<div class="empty">暂无等待审批的动作。</div>'; return; }
    list.innerHTML = rows.map(r => `
      <div class="pending-card" data-id="${esc(r.record_id)}">
        <div>
          <div class="kv"><span class="pill ${tierClass(r.risk_tier)}">${az(r.action)}</span>
          <span class="pill cond">${esc(r.condition||'—')}</span><span class="mono">@${esc(r.actor_role)}</span></div>
          <div class="muted-note">文档：${(r.doc_ids||[]).map(esc).join("、")||'—'} · ${esc(r.record_id)}</div>
        </div>
        <div class="kv">
          <button class="btn ok" onclick="decide('${esc(r.record_id)}','approve')">批准</button>
          <button class="btn danger" onclick="decide('${esc(r.record_id)}','reject')">拒绝</button>
        </div>
      </div>`).join("");
  } catch (e) { list.innerHTML = '<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
}

async function decide(id, action) {
  try {
    const res = await fetch(`${API}/pending/${encodeURIComponent(id)}/${action}`, { method: "POST" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    toast(action === "approve" ? "已批准 → 提交" : "已拒绝 → 驳回");
    loadPending(); refreshCounts();
  } catch (e) { toast("操作失败：" + e.message); }
}

function recordRows(rows) {
  return `<table><thead><tr><th>时间</th><th>动作</th><th>状态</th><th>条件</th><th>角色</th><th>文档</th><th>记录</th></tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td class="mono">${esc((r.created_at||'').replace('T',' ').slice(0,19))}</td>
      <td><span class="pill ${tierClass(r.risk_tier)}">${az(r.action)}</span></td>
      <td><span class="pill ${stateClass(r.approval_state)}">${STATE_ZH[r.approval_state]||esc(r.approval_state)}</span></td>
      <td>${esc(r.condition||'—')}</td>
      <td class="mono">@${esc(r.actor_role)}</td>
      <td>${(r.doc_ids||[]).map(esc).join("、")||'—'}</td>
      <td class="mono">${esc(r.record_id)}</td>
    </tr>`).join("")}</tbody></table>`;
}

async function loadAudit() {
  const el = $("#auditTable");
  try { const rows = await (await fetch(API + "/audit")).json();
    $("#cnt-audit").textContent = rows.length;
    el.innerHTML = rows.length ? recordRows(rows) : '<div class="empty">尚无动作记录。</div>';
  } catch (e) { el.innerHTML = '<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
}

async function loadBlocked() {
  const el = $("#blockedTable");
  try { const rows = await (await fetch(API + "/audit/blocked")).json();
    $("#cnt-blocked").textContent = rows.length;
    el.innerHTML = rows.length ? recordRows(rows) : '<div class="empty">无被拦截 / 升级的动作——没有任何动作突破门控。</div>';
  } catch (e) { el.innerHTML = '<div class="empty">加载失败：'+esc(e.message)+'</div>'; }
}

async function refreshCounts() {
  try {
    const [p, a, b] = await Promise.all([
      fetch(API+"/pending").then(r=>r.json()),
      fetch(API+"/audit").then(r=>r.json()),
      fetch(API+"/audit/blocked").then(r=>r.json()),
    ]);
    $("#cnt-pending").textContent = p.length; $("#cnt-audit").textContent = a.length; $("#cnt-blocked").textContent = b.length;
  } catch (e) {}
}
refreshCounts();
</script>
</body>
