name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks and scan event range
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Full-history secret scan
        run: >-
          gitleaks git
          --config .gitleaks.toml
          --redact
          --no-banner
          --log-opts="--all"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Build reproducible test corpora
        run: |
          uv run --frozen python scripts/ingest_corpus.py \
            --input data/sample_corpus \
            --output data/generated \
            --eval data/generated/ci-no-eval.jsonl
          uv run --frozen python scripts/ingest_corpus.py \
            --input data/public_corpus \
            --output data/generated/public
          uv run --frozen python scripts/ingest_corpus.py \
            --input data/agent_residual_corpus \
            --output data/generated/agent_residual

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: Pytest
        run: uv run --frozen pytest -ra

      - name: Public claim drift gate
        run: uv run --frozen python scripts/check_claim_drift.py

      - name: Interview showcase isolation gate
        run: uv run --frozen python scripts/build_interview_showcase.py --check

      - name: Public repository audit gate
        run: uv run --frozen python scripts/verify_public_repository.py

      - name: Frontend closure artifact gate
        run: uv run --frozen python scripts/verify_frontend_closure.py

      - name: Canonical release manifest gate
        run: uv run --frozen python scripts/build_release_manifest.py verify

      - name: Synthetic release gates
        run: >-
          uv run --frozen python scripts/check_release_gates.py
          --summary tests/fixtures/release_gates/ci_clean_summary.json
          --leakage tests/fixtures/release_gates/ci_clean_leakage.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright Chromium acceptance
        run: npm run test:e2e
        working-directory: frontend
