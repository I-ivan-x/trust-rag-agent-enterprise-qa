name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: Pytest
        run: uv run --frozen pytest -ra

      - name: Public claim drift gate
        run: uv run --frozen python scripts/check_claim_drift.py

      - name: Interview showcase isolation gate
        run: uv run --frozen python scripts/build_interview_showcase.py --check

      - name: Public repository audit gate
        run: uv run --frozen python scripts/verify_public_repository.py

      - name: Frontend closure artifact gate
        run: uv run --frozen python scripts/verify_frontend_closure.py

      - name: Canonical release manifest gate
        run: uv run --frozen python scripts/build_release_manifest.py verify

      - name: Synthetic release gates
        run: >-
          uv run --frozen python scripts/check_release_gates.py
          --summary tests/fixtures/release_gates/ci_clean_summary.json
          --leakage tests/fixtures/release_gates/ci_clean_leakage.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright Chromium acceptance
        run: npm run test:e2e
        working-directory: frontend
